AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Paste an agenda: the agenda-parser Lambda (the backend image with another
  command) behind its own function URL. It runs outside the VPC, checks the
  Cognito access token, calls Claude through Amazon Bedrock and returns a
  suggested agenda as JSON. It never writes anything: the browser saves through
  the API. Deploy with `make aws-deploy-ai`.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  ImageUri:
    Type: String
    Description: >-
      The backend image, pinned by digest:
      <account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: Must match the platform the image was built for.

  CognitoUserPoolId:
    Type: String
    Description: User pool whose access tokens the parser accepts (the auth stack's UserPoolId).

  CognitoClientId:
    Type: String
    Description: The app client those tokens must be issued to (the auth stack's UserPoolClientId).

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock model id (PARSER_MODEL).

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: >-
      Origins the browser may call the parser from: the site's origins plus
      http://localhost:3000 for local development.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs only: no VPC, no database, no S3.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # No API key to store or leak: the role is what may call the model.
        # "*" for now; narrowing it is one of the lab's discussion questions.
        - PolicyName: invoke-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
              # Sonnet 4.6 is served by bedrock-runtime (InvokeModel), through its
              # global inference profile: the call needs the profile and the
              # foundation model in every Region the profile may route to. The
              # global profile's models include one ARN with no Region at all.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"
                  - !Sub "arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.claude-sonnet-4-6"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Outside the VPC (no VpcConfig): Bedrock and Cognito's JWKS are on the
  # internet, and the function never needs the database. Idle, it costs nothing.
  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Parses pasted text into a suggested meeting agenda with Claude on Bedrock
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ParserRole.Arn
      MemorySize: 512
      # Two model calls at most (one retry), each capped at 25 s by the SDK client.
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          LOG_LEVEL: !Ref LogLevel
          # No COGNITO_JWKS: unlike the API, this function can fetch them.
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public, like the API's: the handler checks the Cognito token on every call,
  # because every call costs money. Unlike the API, CORS lives here: the handler
  # is a plain function with no middleware. The URL and permissions take no tags.
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ParserUrl:
    Description: The parser's function URL, without its trailing slash (NEXT_PUBLIC_PARSER_URL)
    Value:
      !Sub [
        "https://${Host}",
        { Host: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]] },
      ]
  FunctionName:
    Value: !Ref ParserFunction
  LogGroupName:
    Value: !Ref ParserLogGroup
