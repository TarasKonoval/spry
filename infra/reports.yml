AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly meetings report: an EventBridge Scheduler schedule (and `make
  report-now`) puts a request on an SQS queue with a dead-letter queue; the
  report-builder Lambda (the backend image with another command) in the
  backend's VPC reads Aurora and writes reports/<week>.csv to a private bucket
  through a free S3 gateway endpoint, since the VPC has no NAT. The new object
  triggers the report-mailer Lambda outside the VPC, which emails the CSV
  through SES. Deploy with `make aws-deploy-reports`: it inlines the mailer's
  code from backend/app/reports/mailer.py.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  ImageUri:
    Type: String
    Description: >-
      The backend image, pinned by digest:
      <account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: Must match the platform the image was built for.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The backend function's VPC.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The backend function's subnets; the builder attaches to the same ones.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The backend function's security group, which the database already
      accepts on 5432, so the builder needs no rule of its own.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables of those subnets, for the S3 gateway endpoint.

  CreateS3Endpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" when the VPC already has an S3 gateway endpoint: a route table
      takes only one route to the S3 prefix list.

  DbEndpoint:
    Type: String
    Description: Aurora writer endpoint (the backend stack's DatabaseEndpoint).

  DbPort:
    Type: Number
    Default: 5432

  DbName:
    Type: String
    Default: meetings

  DbUsername:
    Type: String
    Default: app

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9_-]+"
    Description: The Aurora master password, as passed to the backend stack.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Defines the ISO weeks of the report and the schedule's clock.

  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
    Description: >-
      When the report is built, in AppTimezone. Test with rate(5 minutes),
      then set it back: every run wakes Aurora.

  ReportsEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: must be one email address.
    Description: >-
      Verified as an SES email identity (no domain needed) and used as both the
      sender and the recipient: in the SES sandbox, both must be verified.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Conditions:
  ShouldCreateS3Endpoint: !Equals [!Ref CreateS3Endpoint, "true"]

Resources:
  # --- storage --------------------------------------------------------------

  ReportsBucket:
    Type: AWS::S3::Bucket
    # S3 checks that it may invoke the mailer when the notification is set, so
    # the permission comes first. Its SourceArn is this bucket's ARN, which is
    # why the bucket is named, not generated: with !GetAtt ReportsBucket.Arn,
    # the two would depend on each other.
    DependsOn: MailerInvokePermission
    # Emptied by `make aws-destroy` before the stack goes.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # An event, not a command: the builder does not know the mailer exists.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Without it, the builder's PutObject has no route out of the VPC and hangs
  # until the function times out. Gateway endpoints are free.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateS3Endpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # --- builder --------------------------------------------------------------

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Write logs, and manage the network interfaces a VPC function needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
        # The Lambda service polls the queue with the function's role; the
        # function itself never connects to SQS.
        - PolicyName: consume-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Builds the weekly meetings report and saves it to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt BuilderRole.Arn
      MemorySize: 512
      # A paused cluster takes ~15 s to resume on the first connection.
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          # NOTE: readable in the function configuration, as on the API function.
          DATABASE_URL: !Sub "postgresql+asyncpg://${DbUsername}:${DbPassword}@${DbEndpoint}:${DbPort}/${DbName}"
          APP_TIMEZONE: !Ref AppTimezone
          LOG_LEVEL: !Ref LogLevel
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- queue ----------------------------------------------------------------

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      # The longest SQS allows: time to notice, fix the builder and redrive.
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      # Six times the builder's timeout: a message must not become visible
      # again, and start a second builder, while the first is still running.
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1
      # At most two builders at once (the lowest SQS allows), so a burst of
      # requests waits in the queue instead of using up the account's ten.
      ScalingConfig:
        MaximumConcurrency: 2
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- mailer ---------------------------------------------------------------

  # Creating it makes SES email a verification link to the address; nothing
  # can be sent until it is clicked. Deleting the stack deletes the identity.
  ReportsIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ReportsEmail

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Read-only on S3, on purpose: a function triggered by new objects in
      # reports/ that wrote into reports/ would call itself forever. The ARNs
      # are built, not !Ref'd, so the role does not depend on the bucket.
      Policies:
        - PolicyName: read-reports-and-send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${ReportsEmail}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Outside the VPC (no VpcConfig): it needs SES on the internet, and never
  # the database.
  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Emails each new weekly report through SES
      Runtime: python3.12
      Handler: index.handler
      Architectures: [arm64]
      Role: !GetAtt MailerRole.Arn
      MemorySize: 128
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Code:
        # Replaced with backend/app/reports/mailer.py by `make aws-deploy-reports`.
        ZipFile: MAILER_SOURCE
      Environment:
        Variables:
          REPORTS_FROM: !Ref ReportsEmail
          REPORTS_TO: !Ref ReportsEmail
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- schedule -------------------------------------------------------------

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Schedules take no tags.
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Build last week's meetings report every Monday morning
      ScheduleExpression: !Ref ScheduleExpression
      # Without it the cron runs in UTC, an hour off for half the year.
      ScheduleExpressionTimezone: !Ref AppTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      # A command on the queue, not a call to the function: retries and the
      # dead-letter queue now cover a slow Aurora resume.
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        # No week: the builder takes the one before the current week.
        Input: '{"week": null, "source": "schedule"}'

Outputs:
  BucketName:
    Value: !Ref ReportsBucket
  BuilderFunctionName:
    Value: !Ref BuilderFunction
  BuilderLogGroupName:
    Value: !Ref BuilderLogGroup
  ScheduleName:
    Value: !Ref WeeklySchedule
  MailerFunctionName:
    Value: !Ref MailerFunction
  MailerLogGroupName:
    Value: !Ref MailerLogGroup
  QueueUrl:
    Value: !Ref ReportRequestsQueue
  DeadLetterQueueUrl:
    Value: !Ref ReportRequestsDlq
  S3EndpointId:
    Value: !If [ShouldCreateS3Endpoint, !Ref S3Endpoint, "existing"]
